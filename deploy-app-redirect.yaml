apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-redirect-cm
  labels:
    app: nodejs-someu-front-angular
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      # Redirect all HTTP requests to HTTPS preserving host and path
      return 301 https://$host$request_uri;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-someu-front-angular
  labels:
    app: nodejs-someu-front-angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-someu-front-angular
  template:
    metadata:
      labels:
        app: nodejs-someu-front-angular
    spec:
      containers:
        - name: app
          image: iuripetrola/nodejs-someu-front-angular:latest
          ports:
            - containerPort: 443
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 20
        - name: nginx-redirect
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-redirect-cm
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-someu-front-angular
  labels:
    app: nodejs-someu-front-angular
spec:
  selector:
    app: nodejs-someu-front-angular
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      nodePort: 443
      protocol: TCP